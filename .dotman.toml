[ignore]
patterns = [
    "**/.omc/",
    "**/.omca/",
    "**/.sisyphus/",
    "**/.claude/",
    "**/conductor/",
    "**/*.bak",
    "**/*.bak-*",
    "**/*.maplebak",
    "**/plugins.bak/",
    "**/GEMINI.md",
    "**/eww-colors.*",
    "**/.git/",
    "**/*.swp",
    "**/*~",
    "**/.DS_Store",
    "**/__pycache__/",
    "**/node_modules/",
    "**/*.orig",
    "**/*.rej",
]

[guard]
secret_names = [
    "**/.netrc",
    "**/.env",
    "**/.env.*",
    "**/*.pem",
    "**/*.key",
    "**/id_rsa*",
    "**/id_ed25519*",
    "**/id_ecdsa*",
    "**/*.kdbx",
    "**/*.gpg",
    "**/credentials*",
    "**/*token*",
    "**/*secret*",
    "**/gh/hosts.yml",
    "**/*.ppk",
    "**/rclone.conf",
]

[dirs]
paths = [
    ".config/ghostty",
    ".config/hypr",
    ".config/kitty",
    ".config/niri",
    ".config/nvim",
    ".config/qt5ct",
    ".config/rofi",
    ".config/swaync",
    ".config/waybar",
    ".config/zsh",
]

